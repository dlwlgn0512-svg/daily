<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>클라우드 루틴 & 캘린더 트래커</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --sub: #64748b;
      --primary: #2563eb;
      --primary-light: #eff6ff;
      --border: #e2e8f0;
      --danger: #ef4444;
      --timeline-line: #cbd5e1;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0 0 80px 0;
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
    }
    .app-container {
      width: 100%;
      max-width: 500px;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    .tab-view { display: none; }
    .tab-view.active { display: flex; flex-direction: column; gap: 16px; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.03);
    }
    .header-title { font-size: 1.25rem; font-weight: 700; margin-bottom: 12px; }
    .sync-badge {
      font-size: 0.75rem;
      color: #10b981;
      font-weight: 600;
      margin-left: 8px;
    }
    .progress-meta {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 6px;
    }
    .progress-track {
      background: var(--border);
      height: 8px;
      border-radius: 999px;
      overflow: hidden;
    }
    .progress-bar {
      background: var(--primary);
      height: 100%;
      width: 0%;
      transition: width 0.3s ease;
    }
    .section-title {
      font-size: 0.95rem;
      font-weight: 700;
      margin: 12px 0 8px;
      color: var(--sub);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .todo-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .todo-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 12px;
      cursor: pointer;
      user-select: none;
      background: #fff;
    }
    .todo-item.done { background: #f8fafc; opacity: 0.75; }
    .todo-item.done .todo-text { text-decoration: line-through; color: var(--sub); }
    .item-left { display: flex; align-items: center; gap: 10px; flex: 1; }
    .check-circle {
      width: 20px;
      height: 20px;
      border: 2px solid var(--border);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      color: #fff;
      font-weight: bold;
      flex-shrink: 0;
    }
    .todo-item.done .check-circle {
      background: var(--primary);
      border-color: var(--primary);
    }
    .time-badge {
      font-size: 0.72rem;
      color: var(--primary);
      background: var(--primary-light);
      padding: 2px 6px;
      border-radius: 6px;
      font-weight: 600;
      margin-left: 6px;
      white-space: nowrap;
    }
    .del-btn {
      background: none;
      border: none;
      color: var(--sub);
      font-size: 1.1rem;
      cursor: pointer;
      padding: 0 4px;
    }
    .del-btn:hover { color: var(--danger); }
    .input-row { display: flex; gap: 8px; margin-top: 10px; }
    input[type="text"], input[type="time"] {
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      outline: none;
      font-size: 0.9rem;
    }
    input[type="text"] { flex: 1; }
    input[type="text"]:focus, input[type="time"]:focus { border-color: var(--primary); }
    .btn-action {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 0 16px;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
    .day-selector { display: flex; gap: 4px; margin-bottom: 8px; }
    .day-chip {
      flex: 1;
      padding: 6px 0;
      font-size: 0.75rem;
      text-align: center;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #fff;
      cursor: pointer;
      font-weight: 600;
    }
    .day-chip.active { background: var(--primary); color: #fff; border-color: var(--primary); }
    .table-container { overflow-x: auto; margin-top: 8px; }
    .week-table { width: 100%; border-collapse: collapse; font-size: 0.8rem; text-align: center; }
    .week-table th {
      padding: 8px 4px;
      background: var(--primary-light);
      color: var(--primary);
      border: 1px solid var(--border);
    }
    .week-table td {
      padding: 8px 4px;
      border: 1px solid var(--border);
      vertical-align: top;
      max-width: 60px;
      word-break: break-all;
    }
    .matrix-item {
      display: inline-block;
      background: #f1f5f9;
      border-radius: 4px;
      padding: 2px 4px;
      margin: 2px 0;
      font-size: 0.72rem;
    }

    /* 타임테이블 UI */
    .timeline {
      position: relative;
      margin-top: 14px;
      padding-left: 20px;
      border-left: 2px solid var(--timeline-line);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .timeline-node {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .timeline-node::before {
      content: '';
      position: absolute;
      left: -27px;
      top: 4px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--primary);
      border: 2px solid #fff;
    }
    .timeline-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .timeline-time {
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--primary);
    }
    .timeline-content {
      font-size: 0.9rem;
      color: var(--text);
      background: #f8fafc;
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .timeline-tag {
      font-size: 0.7rem;
      color: var(--sub);
      background: #e2e8f0;
      padding: 1px 5px;
      border-radius: 4px;
      margin-left: 6px;
    }

    /* 캘린더 */
    .cal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; text-align: center; }
    .cal-label { font-size: 0.78rem; color: var(--sub); font-weight: 600; padding-bottom: 4px; }
    .cal-cell {
      min-height: 52px;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      background: #fafafa;
      border: 1px solid transparent;
      cursor: pointer;
    }
    .cal-cell.today { font-weight: bold; border-color: var(--primary); }
    .cal-cell-rate { font-size: 0.65rem; font-weight: 600; margin-top: 2px; }
    .lvl-0 { background: #f8fafc; color: #94a3b8; }
    .lvl-low { background: #fee2e2; color: #b91c1c; }
    .lvl-mid { background: #fef3c7; color: #b45309; }
    .lvl-high { background: #dcfce7; color: #15803d; }
    .lvl-perfect { background: #22c55e; color: #fff; }
    .lvl-perfect .cal-cell-rate { color: #fff; }

    /* 하단 3단 네비게이션 */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 60px;
      background: #fff;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      align-items: center;
      max-width: 500px;
      margin: 0 auto;
      z-index: 100;
    }
    .nav-item {
      flex: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--sub);
      font-size: 0.78rem;
      font-weight: 600;
      gap: 3px;
    }
    .nav-item.active { color: var(--primary); }
    .nav-icon { font-size: 1.15rem; }
  </style>
</head>
<body>

  <div class="app-container">
    
    <!-- 1. 할 일 탭 -->
    <div class="tab-view active" id="tabTodos">
      <!-- 주간 루틴 표 & 등록 (상단 배치) -->
      <div class="card">
        <div class="section-title" style="margin-top: 0;">📅 주간 요일별 루틴 표</div>
        <div class="table-container">
          <table class="week-table">
            <thead>
              <tr>
                <th>월</th><th>화</th><th>수</th><th>목</th><th>금</th><th>토</th><th>일</th>
              </tr>
            </thead>
            <tbody id="weekMatrixBody"></tbody>
          </table>
        </div>

        <div style="margin-top: 14px; border-top: 1px solid var(--border); padding-top: 12px;">
          <span style="font-size: 0.85rem; font-weight: 600; display: block; margin-bottom: 6px;">새 요일 루틴 등록</span>
          <div class="day-selector" id="daySelector">
            <div class="day-chip active" data-day="all">매일</div>
            <div class="day-chip" data-day="1">월</div>
            <div class="day-chip" data-day="2">화</div>
            <div class="day-chip" data-day="3">수</div>
            <div class="day-chip" data-day="4">목</div>
            <div class="day-chip" data-day="5">금</div>
            <div class="day-chip" data-day="6">토</div>
            <div class="day-chip" data-day="0">일</div>
          </div>
          <form class="input-row" id="addRoutineForm">
            <input type="text" id="routineInput" placeholder="요일별 반복 루틴 이름..." autocomplete="off" />
            <button type="submit" class="btn-action">등록</button>
          </form>
        </div>
      </div>

      <!-- 오늘 달성률 & 헤더 -->
      <div class="card">
        <div class="header-title">
          <span id="todayHeader">오늘의 루틴 & 할 일</span>
          <span class="sync-badge" id="syncStatus">● 클라우드 동기화 중</span>
        </div>
        <div class="progress-meta">
          <span>오늘 전체 달성률</span>
          <span id="rateLabel">0%</span>
        </div>
        <div class="progress-track">
          <div class="progress-bar" id="rateBar"></div>
        </div>
      </div>

      <!-- 오늘의 고정 루틴 -->
      <div class="card">
        <div class="section-title" style="margin-top: 0;">
          <span>🔄 오늘의 고정 루틴</span>
          <span id="currentDayOfWeek" style="font-size: 0.8rem; font-weight: normal;"></span>
        </div>
        <ul class="todo-list" id="routineTodoList"></ul>
      </div>

      <!-- 당일 할 일 -->
      <div class="card">
        <div class="section-title" style="margin-top: 0;">📌 당일 해야 할 일</div>
        <ul class="todo-list" id="dailyTodoList"></ul>
        <form class="input-row" id="addDailyForm">
          <input type="text" id="dailyInput" placeholder="오늘 끝낼 할 일 입력..." autocomplete="off" />
          <button type="submit" class="btn-action">추가</button>
        </form>
      </div>
    </div>

    <!-- 2. 오늘의 기록 탭 (타임테이블) -->
    <div class="tab-view" id="tabRecord">
      <div class="card">
        <div class="header-title">⏱️ 오늘의 타임테이블 기록</div>
        <span style="font-size: 0.82rem; color: var(--sub);">루틴 완료 시 20분 단위로 반올림 기록되며, 직접 활동을 입력할 수도 있습니다.</span>
        
        <form class="input-row" id="addTimelineForm" style="margin-top: 14px;">
          <input type="time" id="customTimeInput" required />
          <input type="text" id="customActivityInput" placeholder="활동/메모 기록..." autocomplete="off" required />
          <button type="submit" class="btn-action">기록</button>
        </form>

        <div class="timeline" id="timelineContainer"></div>
      </div>
    </div>

    <!-- 3. 캘린더 탭 -->
    <div class="tab-view" id="tabCalendar">
      <div class="card">
        <div class="cal-header">
          <button onclick="changeMonth(-1)" class="btn-action" style="padding: 4px 10px; background: none; color: var(--text); border: 1px solid var(--border);">&lt;</button>
          <strong id="calMonthYear" style="font-size: 1.05rem;"></strong>
          <button onclick="changeMonth(1)" class="btn-action" style="padding: 4px 10px; background: none; color: var(--text); border: 1px solid var(--border);">&gt;</button>
        </div>
        <div class="cal-grid" id="calGrid"></div>
      </div>
    </div>
  </div>

  <!-- 하단 3단 네비게이션 -->
  <nav class="bottom-nav">
    <div class="nav-item active" onclick="switchTab('todos')" id="navTodos">
      <div class="nav-icon">✓</div>
      <span>할일</span>
    </div>
    <div class="nav-item" onclick="switchTab('record')" id="navRecord">
      <div class="nav-icon">⏱️</div>
      <span>오늘의 기록</span>
    </div>
    <div class="nav-item" onclick="switchTab('cal')" id="navCal">
      <div class="nav-icon">📅</div>
      <span>캘린더</span>
    </div>
  </nav>

  <!-- Firebase SDK 모듈 로드 -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAQ5MamcbSRdxtI1O2eHE848IzuuEwcOEM",
      authDomain: "my-routine-239cb.firebaseapp.com",
      projectId: "my-routine-239cb",
      storageBucket: "my-routine-239cb.firebasestorage.app",
      messagingSenderId: "52295220382",
      appId: "1:52295220382:web:46724e3dcce280f97d4f8f"
    };
    
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const docRef = doc(db, "routine_app", "main_data");

    const DAY_NAMES = ['일', '월', '화', '수', '목', '금', '토'];
    const today = new Date();
    const todayKey = getFormattedDate(today);

    let routineTemplates = [
      { id: 1, text: '기상 직후 물 마시기', days: ['all'] },
      { id: 2, text: '스트레칭 10분', days: [1, 2, 3, 4, 5] },
      { id: 3, text: '주말 산책', days: [0, 6] }
    ];
    let historyRecords = {};
    let calViewDate = new Date();
    let selectedRoutineDays = ['all'];

    function getFormattedDate(d) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }

    // 20분 단위 반올림 시간 포맷팅 함수
    // 0~9분 -> 00분 / 10~29분 -> 20분 / 30~49분 -> 40분 / 50~59분 -> 다음 시간 00분
    function getRounded20MinTimeStr(dateObj = new Date()) {
      let hours = dateObj.getHours();
      let minutes = dateObj.getMinutes();

      let roundedMinutes = Math.round(minutes / 20) * 20;
      if (roundedMinutes === 60) {
        hours = (hours + 1) % 24;
        roundedMinutes = 0;
      }

      const ampm = hours >= 12 ? '오후' : '오전';
      const displayHour = hours % 12 === 0 ? 12 : hours % 12;
      const displayMin = String(roundedMinutes).padStart(2, '0');

      return `${ampm} ${String(displayHour).padStart(2, '0')}:${displayMin}`;
    }

    function ensureTodayData() {
      if (!historyRecords[todayKey]) {
        historyRecords[todayKey] = {
          routineDone: {},
          routineTimes: {},
          oneOffTasks: [],
          timelineEvents: []
        };
      }
      if (!historyRecords[todayKey].routineTimes) historyRecords[todayKey].routineTimes = {};
      if (!historyRecords[todayKey].timelineEvents) historyRecords[todayKey].timelineEvents = [];
    }

    // Firestore 실시간 리스너
    onSnapshot(docRef, (docSnap) => {
      if (docSnap.exists()) {
        const data = docSnap.data();
        routineTemplates = data.routineTemplates || routineTemplates;
        historyRecords = data.historyRecords || {};
      }
      ensureTodayData();
      document.getElementById('syncStatus').textContent = '● 클라우드 동기화 완료';
      renderToday();
      renderMatrix();
      renderTimeline();
      renderCalendar();
    }, (error) => {
      console.error("Firebase Error: ", error);
      document.getElementById('syncStatus').textContent = '⚠️ 동기화 실패 (설정 확인)';
      document.getElementById('syncStatus').style.color = 'var(--danger)';
    });

    // Firestore 업로드
    async function syncToFirebase() {
      document.getElementById('syncStatus').textContent = '● 저장 중...';
      try {
        await setDoc(docRef, {
          routineTemplates,
          historyRecords
        });
      } catch (e) {
        console.error("Save Error: ", e);
      }
    }

    // 탭 전환 핸들러
    window.switchTab = function(tab) {
      document.getElementById('tabTodos').classList.toggle('active', tab === 'todos');
      document.getElementById('tabRecord').classList.toggle('active', tab === 'record');
      document.getElementById('tabCalendar').classList.toggle('active', tab === 'cal');

      document.getElementById('navTodos').classList.toggle('active', tab === 'todos');
      document.getElementById('navRecord').classList.toggle('active', tab === 'record');
      document.getElementById('navCal').classList.toggle('active', tab === 'cal');

      if (tab === 'todos') renderToday();
      else if (tab === 'record') renderTimeline();
      else renderCalendar();
    };

    // 요일 칩 선택 이벤트
    document.querySelectorAll('#daySelector .day-chip').forEach(chip => {
      chip.addEventListener('click', () => {
        const day = chip.dataset.day;
        if (day === 'all') {
          selectedRoutineDays = ['all'];
          document.querySelectorAll('#daySelector .day-chip').forEach(c => c.classList.remove('active'));
          chip.classList.add('active');
        } else {
          document.querySelector('#daySelector .day-chip[data-day="all"]').classList.remove('active');
          selectedRoutineDays = selectedRoutineDays.filter(d => d !== 'all');
          const dNum = parseInt(day);
          if (selectedRoutineDays.includes(dNum)) {
            selectedRoutineDays = selectedRoutineDays.filter(d => d !== dNum);
            chip.classList.remove('active');
          } else {
            selectedRoutineDays.push(dNum);
            chip.classList.add('active');
          }
          if (selectedRoutineDays.length === 0) {
            selectedRoutineDays = ['all'];
            document.querySelector('#daySelector .day-chip[data-day="all"]').classList.add('active');
          }
        }
      });
    });

    // 오늘 할 일 탭 렌더링
    function renderToday() {
      ensureTodayData();
      const dayOfWeek = today.getDay();
      document.getElementById('todayHeader').textContent = `${today.getMonth() + 1}월 ${today.getDate()}일 (${DAY_NAMES[dayOfWeek]})`;
      document.getElementById('currentDayOfWeek').textContent = `매주 ${DAY_NAMES[dayOfWeek]}요일 루틴`;

      const todaysRoutines = routineTemplates.filter(r => r.days.includes('all') || r.days.includes(dayOfWeek));
      const record = historyRecords[todayKey];

      // 1. 루틴 리스트
      const rList = document.getElementById('routineTodoList');
      rList.innerHTML = '';
      if (todaysRoutines.length === 0) {
        rList.innerHTML = `<li style="color:var(--sub);font-size:0.85rem;text-align:center;padding:10px;">등록된 오늘 루틴이 없습니다.</li>`;
      } else {
        todaysRoutines.forEach(r => {
          const isDone = !!record.routineDone[r.id];
          const timeText = record.routineTimes[r.id] || '';
          const li = document.createElement('li');
          li.className = `todo-item ${isDone ? 'done' : ''}`;
          li.innerHTML = `
            <div class="item-left">
              <div class="check-circle">${isDone ? '✓' : ''}</div>
              <span class="todo-text">${r.text}</span>
              ${isDone && timeText ? `<span class="time-badge">${timeText}</span>` : ''}
            </div>
            <button class="del-btn">&times;</button>
          `;
          li.querySelector('.item-left').onclick = () => {
            const nextState = !isDone;
            record.routineDone[r.id] = nextState;
            if (nextState) {
              const roundedTime = getRounded20MinTimeStr();
              record.routineTimes[r.id] = roundedTime;
              record.timelineEvents.push({
                id: 'rt_' + r.id + '_' + Date.now(),
                time: roundedTime,
                text: `[루틴 완료] ${r.text}`,
                type: 'routine'
              });
            } else {
              delete record.routineTimes[r.id];
            }
            syncToFirebase();
          };
          li.querySelector('.del-btn').onclick = (e) => {
            e.stopPropagation();
            if (confirm('이 반복 루틴을 삭제하시겠습니까?')) {
              routineTemplates = routineTemplates.filter(t => t.id !== r.id);
              syncToFirebase();
            }
          };
          rList.appendChild(li);
        });
      }

      // 2. 당일 할 일 리스트
      const dList = document.getElementById('dailyTodoList');
      dList.innerHTML = '';
      if (record.oneOffTasks.length === 0) {
        dList.innerHTML = `<li style="color:var(--sub);font-size:0.85rem;text-align:center;padding:10px;">당일 할 일이 없습니다.</li>`;
      } else {
        record.oneOffTasks.forEach(task => {
          const li = document.createElement('li');
          li.className = `todo-item ${task.done ? 'done' : ''}`;
          li.innerHTML = `
            <div class="item-left">
              <div class="check-circle">${task.done ? '✓' : ''}</div>
              <span class="todo-text">${task.text}</span>
              ${task.done && task.time ? `<span class="time-badge">${task.time}</span>` : ''}
            </div>
            <button class="del-btn">&times;</button>
          `;
          li.querySelector('.item-left').onclick = () => {
            task.done = !task.done;
            if (task.done) {
              task.time = getRounded20MinTimeStr();
              record.timelineEvents.push({
                id: 'task_' + task.id + '_' + Date.now(),
                time: task.time,
                text: `[할일 완료] ${task.text}`,
                type: 'task'
              });
            } else {
              task.time = null;
            }
            syncToFirebase();
          };
          li.querySelector('.del-btn').onclick = (e) => {
            e.stopPropagation();
            record.oneOffTasks = record.oneOffTasks.filter(t => t.id !== task.id);
            syncToFirebase();
          };
          dList.appendChild(li);
        });
      }

      // 3. 달성률
      const totalItems = todaysRoutines.length + record.oneOffTasks.length;
      const routineDoneCount = todaysRoutines.filter(r => record.routineDone[r.id]).length;
      const oneOffDoneCount = record.oneOffTasks.filter(t => t.done).length;
      const doneTotal = routineDoneCount + oneOffDoneCount;
      const rate = totalItems === 0 ? 0 : Math.round((doneTotal / totalItems) * 100);

      document.getElementById('rateBar').style.width = rate + '%';
      document.getElementById('rateLabel').textContent = `${rate}% (${doneTotal}/${totalItems})`;
    }

    // 오늘의 기록(타임테이블) 렌더링
    function renderTimeline() {
      ensureTodayData();
      const container = document.getElementById('timelineContainer');
      container.innerHTML = '';

      const events = historyRecords[todayKey].timelineEvents || [];
      if (events.length === 0) {
        container.innerHTML = `<div style="color:var(--sub);font-size:0.85rem;padding:12px 0;">아직 기록된 타임라인이 없습니다.</div>`;
        return;
      }

      events.forEach(item => {
        const node = document.createElement('div');
        node.className = 'timeline-node';
        node.innerHTML = `
          <div class="timeline-header">
            <span class="timeline-time">${item.time}</span>
            <button class="del-btn" style="font-size:0.9rem;" title="기록 삭제">&times;</button>
          </div>
          <div class="timeline-content">
            <span>${item.text}</span>
            <span class="timeline-tag">${item.type === 'manual' ? '직접입력' : '체크연동'}</span>
          </div>
        `;
        node.querySelector('.del-btn').onclick = () => {
          historyRecords[todayKey].timelineEvents = events.filter(e => e.id !== item.id);
          syncToFirebase();
        };
        container.appendChild(node);
      });
    }

    // 타임라인 수동 추가
    document.getElementById('addTimelineForm').addEventListener('submit', (e) => {
      e.preventDefault();
      ensureTodayData();
      const timeInput = document.getElementById('customTimeInput');
      const textInput = document.getElementById('customActivityInput');
      if (!timeInput.value || !textInput.value.trim()) return;

      const [h, m] = timeInput.value.split(':');
      const tempDate = new Date();
      tempDate.setHours(parseInt(h), parseInt(m), 0, 0);

      const displayTime = getRounded20MinTimeStr(tempDate);

      historyRecords[todayKey].timelineEvents.push({
        id: 'manual_' + Date.now(),
        time: displayTime,
        text: textInput.value.trim(),
        type: 'manual'
      });

      timeInput.value = '';
      textInput.value = '';
      syncToFirebase();
    });

    // 주간 루틴 매트릭스
    function renderMatrix() {
      const tbody = document.getElementById('weekMatrixBody');
      tbody.innerHTML = '';
      const row = document.createElement('tr');
      const order = [1, 2, 3, 4, 5, 6, 0];

      order.forEach(dayIndex => {
        const td = document.createElement('td');
        const dayTasks = routineTemplates.filter(r => r.days.includes('all') || r.days.includes(dayIndex));
        if (dayTasks.length === 0) {
          td.innerHTML = `<span style="color:#cbd5e1;">-</span>`;
        } else {
          dayTasks.forEach(t => {
            const span = document.createElement('div');
            span.className = 'matrix-item';
            span.textContent = t.text;
            td.appendChild(span);
          });
        }
        row.appendChild(td);
      });
      tbody.appendChild(row);
    }

    // 캘린더
    function renderCalendar() {
      const year = calViewDate.getFullYear();
      const month = calViewDate.getMonth();
      document.getElementById('calMonthYear').textContent = `${year}년 ${month + 1}월`;

      const grid = document.getElementById('calGrid');
      grid.innerHTML = '';

      ['일', '월', '화', '수', '목', '금', '토'].forEach(label => {
        const d = document.createElement('div');
        d.className = 'cal-label';
        d.textContent = label;
        grid.appendChild(d);
      });

      const firstDay = new Date(year, month, 1).getDay();
      const totalDays = new Date(year, month + 1, 0).getDate();

      for (let i = 0; i < firstDay; i++) {
        grid.appendChild(document.createElement('div'));
      }

      for (let day = 1; day <= totalDays; day++) {
        const d = new Date(year, month, day);
        const dKey = getFormattedDate(d);
        const dayOfWeek = d.getDay();

        const cell = document.createElement('div');
        cell.className = 'cal-cell';
        if (dKey === todayKey) cell.classList.add('today');

        const record = historyRecords[dKey];
        const dayRoutines = routineTemplates.filter(r => r.days.includes('all') || r.days.includes(dayOfWeek));
        let totalCount = dayRoutines.length + (record ? record.oneOffTasks.length : 0);
        let doneCount = 0;

        if (record) {
          doneCount += dayRoutines.filter(r => record.routineDone[r.id]).length;
          doneCount += record.oneOffTasks.filter(t => t.done).length;
        }

        const rate = totalCount > 0 ? Math.round((doneCount / totalCount) * 100) : 0;

        if (totalCount > 0 && record) {
          if (rate === 100) cell.classList.add('lvl-perfect');
          else if (rate >= 70) cell.classList.add('lvl-high');
          else if (rate >= 30) cell.classList.add('lvl-mid');
          else if (rate > 0) cell.classList.add('lvl-low');
          else cell.classList.add('lvl-0');
        }

        cell.innerHTML = `
          <span>${day}</span>
          ${totalCount > 0 && record ? `<span class="cal-cell-rate">${rate}%</span>` : ''}
        `;
        grid.appendChild(cell);
      }
    }

    window.changeMonth = function(delta) {
      calViewDate.setMonth(calViewDate.getMonth() + delta);
      renderCalendar();
    };

    document.getElementById('addDailyForm').addEventListener('submit', (e) => {
      e.preventDefault();
      ensureTodayData();
      const input = document.getElementById('dailyInput');
      const text = input.value.trim();
      if (!text) return;
      historyRecords[todayKey].oneOffTasks.push({ id: Date.now(), text, done: false, time: null });
      input.value = '';
      syncToFirebase();
    });

    document.getElementById('addRoutineForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const input = document.getElementById('routineInput');
      const text = input.value.trim();
      if (!text) return;
      routineTemplates.push({ id: Date.now(), text, days: [...selectedRoutineDays] });
      input.value = '';
      syncToFirebase();
    });
  </script>
</body>
</html>
