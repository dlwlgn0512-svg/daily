<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daily Routine & Todo</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --sub: #64748b;
      --primary: #2563eb;
      --primary-light: #eff6ff;
      --border: #e2e8f0;
      --success: #10b981;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0 0 80px 0;
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
    }
    .app-container {
      width: 100%;
      max-width: 500px;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    /* 탭 화면 전환 */
    .tab-view { display: none; }
    .tab-view.active { display: flex; flex-direction: column; gap: 16px; }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.03);
    }

    /* 헤더 및 진행률 */
    .header-title {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 12px;
    }
    .progress-meta {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 6px;
    }
    .progress-track {
      background: var(--border);
      height: 8px;
      border-radius: 999px;
      overflow: hidden;
    }
    .progress-bar {
      background: var(--primary);
      height: 100%;
      width: 0%;
      transition: width 0.3s ease;
    }

    /* 할 일 리스트 */
    .section-title {
      font-size: 0.95rem;
      font-weight: 700;
      margin: 12px 0 8px;
      color: var(--sub);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .todo-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .todo-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 12px;
      cursor: pointer;
      user-select: none;
      background: #fff;
    }
    .todo-item.done {
      background: #f8fafc;
      opacity: 0.6;
    }
    .todo-item.done .todo-text {
      text-decoration: line-through;
      color: var(--sub);
    }
    .item-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .check-circle {
      width: 20px;
      height: 20px;
      border: 2px solid var(--border);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      color: #fff;
      font-weight: bold;
    }
    .todo-item.done .check-circle {
      background: var(--primary);
      border-color: var(--primary);
    }
    .del-btn {
      background: none;
      border: none;
      color: var(--sub);
      font-size: 1.1rem;
      cursor: pointer;
      padding: 0 4px;
    }
    .del-btn:hover { color: var(--danger); }

    /* 입력 폼 */
    .input-row {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }
    input[type="text"] {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      outline: none;
      font-size: 0.9rem;
    }
    input[type="text"]:focus { border-color: var(--primary); }
    .btn-action {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 0 16px;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
    }

    /* 요일 칩 선택기 */
    .day-selector {
      display: flex;
      gap: 4px;
      margin-bottom: 8px;
    }
    .day-chip {
      flex: 1;
      padding: 6px 0;
      font-size: 0.75rem;
      text-align: center;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #fff;
      cursor: pointer;
      font-weight: 600;
    }
    .day-chip.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    /* 주간 루틴 매트릭스 표 */
    .table-container {
      overflow-x: auto;
      margin-top: 8px;
    }
    .week-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.8rem;
      text-align: center;
    }
    .week-table th {
      padding: 8px 4px;
      background: var(--primary-light);
      color: var(--primary);
      border: 1px solid var(--border);
    }
    .week-table td {
      padding: 8px 4px;
      border: 1px solid var(--border);
      vertical-align: top;
      max-width: 60px;
      word-break: break-all;
    }
    .matrix-item {
      display: inline-block;
      background: #f1f5f9;
      border-radius: 4px;
      padding: 2px 4px;
      margin: 2px 0;
      font-size: 0.72rem;
    }

    /* 캘린더 */
    .cal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
      text-align: center;
    }
    .cal-label {
      font-size: 0.78rem;
      color: var(--sub);
      font-weight: 600;
      padding-bottom: 4px;
    }
    .cal-cell {
      min-height: 52px;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      background: #fafafa;
      border: 1px solid transparent;
      cursor: pointer;
    }
    .cal-cell.today { font-weight: bold; border-color: var(--primary); }
    .cal-cell-rate { font-size: 0.65rem; font-weight: 600; margin-top: 2px; }
    .lvl-0 { background: #f8fafc; color: #94a3b8; }
    .lvl-low { background: #fee2e2; color: #b91c1c; }
    .lvl-mid { background: #fef3c7; color: #b45309; }
    .lvl-high { background: #dcfce7; color: #15803d; }
    .lvl-perfect { background: #22c55e; color: #fff; }
    .lvl-perfect .cal-cell-rate { color: #fff; }

    /* 하단 네비게이션 바 */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 60px;
      background: #fff;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      align-items: center;
      max-width: 500px;
      margin: 0 auto;
      z-index: 100;
    }
    .nav-item {
      flex: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--sub);
      font-size: 0.8rem;
      font-weight: 600;
      gap: 3px;
    }
    .nav-item.active { color: var(--primary); }
    .nav-icon { font-size: 1.2rem; }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- 1. 할 일 탭 화면 -->
    <div class="tab-view active" id="tabTodos">
      <div class="card">
        <div class="header-title" id="todayHeader">오늘의 루틴 & 할 일</div>
        <div class="progress-meta">
          <span>오늘 전체 달성률</span>
          <span id="rateLabel">0%</span>
        </div>
        <div class="progress-track">
          <div class="progress-bar" id="rateBar"></div>
        </div>
      </div>

      <!-- 오늘 요일 루틴 -->
      <div class="card">
        <div class="section-title">
          <span>🔄 오늘의 고정 루틴</span>
          <span id="currentDayOfWeek" style="font-size: 0.8rem; font-weight: normal;"></span>
        </div>
        <ul class="todo-list" id="routineTodoList"></ul>
      </div>

      <!-- 당일 할 일 (단발성) -->
      <div class="card">
        <div class="section-title">📌 당일 해야 할 일</div>
        <ul class="todo-list" id="dailyTodoList"></ul>
        <form class="input-row" id="addDailyForm">
          <input type="text" id="dailyInput" placeholder="오늘 끝낼 할 일 입력..." autocomplete="off" />
          <button type="submit" class="btn-action">추가</button>
        </form>
      </div>

      <!-- 일주일 요일별 루틴 관리 및 표 -->
      <div class="card">
        <div class="section-title">📅 주간 요일별 루틴 표</div>
        <div class="table-container">
          <table class="week-table">
            <thead>
              <tr>
                <th>월</th><th>화</th><th>수</th><th>목</th><th>금</th><th>토</th><th>일</th>
              </tr>
            </thead>
            <tbody id="weekMatrixBody"></tbody>
          </table>
        </div>

        <div style="margin-top: 14px; border-top: 1px solid var(--border); padding-top: 12px;">
          <span style="font-size: 0.85rem; font-weight: 600; display: block; margin-bottom: 6px;">새 요일 루틴 등록</span>
          <div class="day-selector" id="daySelector">
            <div class="day-chip active" data-day="all">매일</div>
            <div class="day-chip" data-day="1">월</div>
            <div class="day-chip" data-day="2">화</div>
            <div class="day-chip" data-day="3">수</div>
            <div class="day-chip" data-day="4">목</div>
            <div class="day-chip" data-day="5">금</div>
            <div class="day-chip" data-day="6">토</div>
            <div class="day-chip" data-day="0">일</div>
          </div>
          <form class="input-row" id="addRoutineForm">
            <input type="text" id="routineInput" placeholder="요일별 반복 루틴 이름..." autocomplete="off" />
            <button type="submit" class="btn-action">등록</button>
          </form>
        </div>
      </div>
    </div>

    <!-- 2. 캘린더 탭 화면 -->
    <div class="tab-view" id="tabCalendar">
      <div class="card">
        <div class="cal-header">
          <button onclick="changeMonth(-1)" class="btn-action" style="padding: 4px 10px; background: none; color: var(--text); border: 1px solid var(--border);">&lt;</button>
          <strong id="calMonthYear" style="font-size: 1.05rem;"></strong>
          <button onclick="changeMonth(1)" class="btn-action" style="padding: 4px 10px; background: none; color: var(--text); border: 1px solid var(--border);">&gt;</button>
        </div>
        <div class="cal-grid" id="calGrid"></div>
      </div>
    </div>
  </div>

  <!-- 하단 네비게이션 바 -->
  <nav class="bottom-nav">
    <div class="nav-item active" onclick="switchTab('todos')" id="navTodos">
      <div class="nav-icon">✓</div>
      <span>할일</span>
    </div>
    <div class="nav-item" onclick="switchTab('cal')" id="navCal">
      <div class="nav-icon">📅</div>
      <span>캘린더</span>
    </div>
  </nav>

  <script>
    const DAY_NAMES = ['일', '월', '화', '수', '목', '금', '토'];
    const today = new Date();
    const todayKey = getFormattedDate(today);

    // 저장소 구조:
    // 1. routineTemplates: [{ id, text, days: ['all' | 0~6] }]
    // 2. dailyRecords: { 'YYYY-MM-DD': { routineDone: { id: bool }, oneOffTasks: [{ id, text, done }] } }
    let routineTemplates = JSON.parse(localStorage.getItem('routine_templates')) || [
      { id: 1, text: '기상 직후 물 마시기', days: ['all'] },
      { id: 2, text: '스트레칭 10분', days: [1, 2, 3, 4, 5] },
      { id: 3, text: '주말 산책', days: [0, 6] }
    ];

    let historyRecords = JSON.parse(localStorage.getItem('history_records')) || {};

    if (!historyRecords[todayKey]) {
      historyRecords[todayKey] = { routineDone: {}, oneOffTasks: [] };
    }

    let calViewDate = new Date();
    let selectedRoutineDays = ['all'];

    function getFormattedDate(d) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }

    function saveAndSync() {
      localStorage.setItem('routine_templates', JSON.stringify(routineTemplates));
      localStorage.setItem('history_records', JSON.stringify(historyRecords));
      renderToday();
      renderMatrix();
    }

    // 탭 전환
    function switchTab(tab) {
      const tabTodos = document.getElementById('tabTodos');
      const tabCalendar = document.getElementById('tabCalendar');
      const navTodos = document.getElementById('navTodos');
      const navCal = document.getElementById('navCal');

      if (tab === 'todos') {
        tabTodos.classList.add('active');
        tabCalendar.classList.remove('active');
        navTodos.classList.add('active');
        navCal.classList.remove('active');
        renderToday();
      } else {
        tabTodos.classList.remove('active');
        tabCalendar.classList.add('active');
        navTodos.classList.remove('active');
        navCal.classList.add('active');
        renderCalendar();
      }
    }

    // 요일 선택 칩 바인딩
    document.querySelectorAll('#daySelector .day-chip').forEach(chip => {
      chip.addEventListener('click', () => {
        const day = chip.dataset.day;
        if (day === 'all') {
          selectedRoutineDays = ['all'];
          document.querySelectorAll('#daySelector .day-chip').forEach(c => c.classList.remove('active'));
          chip.classList.add('active');
        } else {
          document.querySelector('#daySelector .day-chip[data-day="all"]').classList.remove('active');
          selectedRoutineDays = selectedRoutineDays.filter(d => d !== 'all');
          const dNum = parseInt(day);
          if (selectedRoutineDays.includes(dNum)) {
            selectedRoutineDays = selectedRoutineDays.filter(d => d !== dNum);
            chip.classList.remove('active');
          } else {
            selectedRoutineDays.push(dNum);
            chip.classList.add('active');
          }
          if (selectedRoutineDays.length === 0) {
            selectedRoutineDays = ['all'];
            document.querySelector('#daySelector .day-chip[data-day="all"]').classList.add('active');
          }
        }
      });
    });

    // 오늘 할일 렌더링
    function renderToday() {
      const dayOfWeek = today.getDay();
      document.getElementById('todayHeader').textContent = `${today.getMonth() + 1}월 ${today.getDate()}일 (${DAY_NAMES[dayOfWeek]})`;
      document.getElementById('currentDayOfWeek').textContent = `매주 ${DAY_NAMES[dayOfWeek]}요일 루틴`;

      const todaysRoutines = routineTemplates.filter(r => r.days.includes('all') || r.days.includes(dayOfWeek));
      const record = historyRecords[todayKey] || { routineDone: {}, oneOffTasks: [] };

      // 1. 고정 루틴 리스트
      const rList = document.getElementById('routineTodoList');
      rList.innerHTML = '';
      if (todaysRoutines.length === 0) {
        rList.innerHTML = `<li style="color:var(--sub);font-size:0.85rem;text-align:center;padding:10px;">등록된 오늘 루틴이 없습니다.</li>`;
      } else {
        todaysRoutines.forEach(r => {
          const isDone = !!record.routineDone[r.id];
          const li = document.createElement('li');
          li.className = `todo-item ${isDone ? 'done' : ''}`;
          li.innerHTML = `
            <div class="item-left">
              <div class="check-circle">${isDone ? '✓' : ''}</div>
              <span class="todo-text">${r.text}</span>
            </div>
            <button class="del-btn" title="루틴 삭제">&times;</button>
          `;
          li.querySelector('.item-left').onclick = () => {
            record.routineDone[r.id] = !isDone;
            saveAndSync();
          };
          li.querySelector('.del-btn').onclick = (e) => {
            e.stopPropagation();
            if (confirm('이 반복 루틴을 삭제하시겠습니까?')) {
              routineTemplates = routineTemplates.filter(t => t.id !== r.id);
              saveAndSync();
            }
          };
          rList.appendChild(li);
        });
      }

      // 2. 당일 단발성 할 일 리스트
      const dList = document.getElementById('dailyTodoList');
      dList.innerHTML = '';
      if (record.oneOffTasks.length === 0) {
        dList.innerHTML = `<li style="color:var(--sub);font-size:0.85rem;text-align:center;padding:10px;">당일 할 일이 없습니다.</li>`;
      } else {
        record.oneOffTasks.forEach(task => {
          const li = document.createElement('li');
          li.className = `todo-item ${task.done ? 'done' : ''}`;
          li.innerHTML = `
            <div class="item-left">
              <div class="check-circle">${task.done ? '✓' : ''}</div>
              <span class="todo-text">${task.text}</span>
            </div>
            <button class="del-btn">&times;</button>
          `;
          li.querySelector('.item-left').onclick = () => {
            task.done = !task.done;
            saveAndSync();
          };
          li.querySelector('.del-btn').onclick = (e) => {
            e.stopPropagation();
            record.oneOffTasks = record.oneOffTasks.filter(t => t.id !== task.id);
            saveAndSync();
          };
          dList.appendChild(li);
        });
      }

      // 3. 달성률 계산
      const totalItems = todaysRoutines.length + record.oneOffTasks.length;
      const routineDoneCount = todaysRoutines.filter(r => record.routineDone[r.id]).length;
      const oneOffDoneCount = record.oneOffTasks.filter(t => t.done).length;
      const doneTotal = routineDoneCount + oneOffDoneCount;
      const rate = totalItems === 0 ? 0 : Math.round((doneTotal / totalItems) * 100);

      document.getElementById('rateBar').style.width = rate + '%';
      document.getElementById('rateLabel').textContent = `${rate}% (${doneTotal}/${totalItems})`;
    }

    // 요일 루틴 표 매트릭스
    function renderMatrix() {
      const tbody = document.getElementById('weekMatrixBody');
      tbody.innerHTML = '';
      const row = document.createElement('tr');
      // 월(1)부터 일(0) 순서
      const order = [1, 2, 3, 4, 5, 6, 0];

      order.forEach(dayIndex => {
        const td = document.createElement('td');
        const dayTasks = routineTemplates.filter(r => r.days.includes('all') || r.days.includes(dayIndex));
        if (dayTasks.length === 0) {
          td.innerHTML = `<span style="color:#cbd5e1;">-</span>`;
        } else {
          dayTasks.forEach(t => {
            const span = document.createElement('div');
            span.className = 'matrix-item';
            span.textContent = t.text;
            td.appendChild(span);
          });
        }
        row.appendChild(td);
      });
      tbody.appendChild(row);
    }

    // 캘린더 화면
    function renderCalendar() {
      const year = calViewDate.getFullYear();
      const month = calViewDate.getMonth();
      document.getElementById('calMonthYear').textContent = `${year}년 ${month + 1}월`;

      const grid = document.getElementById('calGrid');
      grid.innerHTML = '';

      ['일', '월', '화', '수', '목', '금', '토'].forEach(label => {
        const d = document.createElement('div');
        d.className = 'cal-label';
        d.textContent = label;
        grid.appendChild(d);
      });

      const firstDay = new Date(year, month, 1).getDay();
      const totalDays = new Date(year, month + 1, 0).getDate();

      for (let i = 0; i < firstDay; i++) {
        grid.appendChild(document.createElement('div'));
      }

      for (let day = 1; day <= totalDays; day++) {
        const d = new Date(year, month, day);
        const dKey = getFormattedDate(d);
        const dayOfWeek = d.getDay();

        const cell = document.createElement('div');
        cell.className = 'cal-cell';
        if (dKey === todayKey) cell.classList.add('today');

        // 과거 날짜 또는 오늘 달성률 계산
        const record = historyRecords[dKey];
        const dayRoutines = routineTemplates.filter(r => r.days.includes('all') || r.days.includes(dayOfWeek));
        let totalCount = dayRoutines.length + (record ? record.oneOffTasks.length : 0);
        let doneCount = 0;

        if (record) {
          doneCount += dayRoutines.filter(r => record.routineDone[r.id]).length;
          doneCount += record.oneOffTasks.filter(t => t.done).length;
        }

        const rate = totalCount > 0 ? Math.round((doneCount / totalCount) * 100) : 0;

        if (totalCount > 0 && record) {
          if (rate === 100) cell.classList.add('lvl-perfect');
          else if (rate >= 70) cell.classList.add('lvl-high');
          else if (rate >= 30) cell.classList.add('lvl-mid');
          else if (rate > 0) cell.classList.add('lvl-low');
          else cell.classList.add('lvl-0');
        }

        cell.innerHTML = `
          <span>${day}</span>
          ${totalCount > 0 && record ? `<span class="cal-cell-rate">${rate}%</span>` : ''}
        `;
        grid.appendChild(cell);
      }
    }

    function changeMonth(delta) {
      calViewDate.setMonth(calViewDate.getMonth() + delta);
      renderCalendar();
    }

    // 폼 이벤트 핸들러
    document.getElementById('addDailyForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const input = document.getElementById('dailyInput');
      const text = input.value.trim();
      if (!text) return;
      historyRecords[todayKey].oneOffTasks.push({ id: Date.now(), text, done: false });
      input.value = '';
      saveAndSync();
    });

    document.getElementById('addRoutineForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const input = document.getElementById('routineInput');
      const text = input.value.trim();
      if (!text) return;
      routineTemplates.push({ id: Date.now(), text, days: [...selectedRoutineDays] });
      input.value = '';
      saveAndSync();
    });

    // 시작
    renderToday();
    renderMatrix();
  </script>
</body>
</html>
